<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduNavi — tunni statistika</title>
    <meta name="description" content="EduNavi tunni järelvaade — etappide kuumakaart, mustrid, statistika." />
    <meta name="theme-color" content="#000000" />
    <link rel="canonical" href="https://edunavi.vercel.app/lesson" />
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='50%25' y='62%25' font-family='Arial' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />
  </head>
  <body class="lesson-detail-body">
    <header class="class-header">
      <a href="/" class="wordmark" style="border:0; color:var(--text);">EduNavi <small>Tunni statistika</small></a>
      <div class="class-meta-bar">
        <span id="lesson-room" class="mono">—</span>
        <span id="lesson-when" class="mono">—</span>
        <span id="lesson-topic" class="mono">—</span>
      </div>
      <a href="/history" class="ghost-button" style="text-decoration:none; padding:10px 18px;">Tagasi ajalukku</a>
    </header>

    <main class="class-main">
      <section id="lesson-loading" class="lesson-state">Laadin tunni andmeid…</section>
      <section id="lesson-empty" class="lesson-state" style="display:none;">
        Selle tunni andmeid ei leitud või sa pole sisse logitud.<br />
        <a href="/history" style="margin-top:14px; display:inline-block;">Tagasi ajalukku</a>
      </section>

      <div id="lesson-body" style="display:none; flex-direction:column; gap:36px;">
        <section class="recommendation">
          <span class="eyebrow">Tunni kokkuvõte</span>
          <h1 id="lesson-headline" class="rec-headline">—</h1>
          <p id="lesson-detail" class="rec-detail"></p>
        </section>

        <section>
          <div class="grid-section-head">
            <span class="eyebrow">Etappide kuumakaart</span>
            <span class="grid-legend">
              <span class="leg leg-correct">sai aru</span>
              <span class="leg leg-partial">TI aitas</span>
              <span class="leg leg-wrong">jäi kinni</span>
            </span>
          </div>
          <div class="lesson-polar-wrap">
            <canvas id="lesson-polar"></canvas>
          </div>
        </section>

        <section>
          <span class="eyebrow">Etappide tabel</span>
          <div class="lesson-steps-list" id="lesson-steps-list"></div>
        </section>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="db.js"></script>
    <script src="auth.js"></script>
    <script src="lesson.js"></script>
  </body>
</html>

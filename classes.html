  <body class="classes-body">
    <header class="class-header">
      <a href="/" class="wordmark" style="border:0; color:var(--text);">EduNavi <small>Võimendatud õpetaja</small></a>
      <div class="class-meta-bar">
        <span class="mono">Tallinna 21. Kool</span>
        <span class="mono">Teema: Murdude põhitehted</span>
        <span class="mono" id="classes-count">— klassi</span>

        <a href="/class" class="ghost-button" style="text-decoration:none; padding:10px 18px;">Üks klass</a>
      </div>
    </header>

    <main class="class-main">
      <section class="recommendation">
        <span class="eyebrow">Sinu prioriteet praegu</span>
        <h1 id="multi-headline" class="rec-headline">Laadin…</h1>
        <p id="multi-detail" class="rec-detail"></p>
      </section>

      <section class="classes-grid" id="classes-grid"></section>

      <section class="patterns">
        <span class="eyebrow">Mitme klassi koondmuster</span>
        <ul id="multi-patterns" class="patterns-list"></ul>
      </section>
    </main>

    <script src="class-data.js"></script>
    <script src="classes.js"></script>

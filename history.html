<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduNavi — Tundide ajalugu</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='50%25' y='62%25' font-family='Arial' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />
  </head>
  <body class="history-body">
    <header class="history-header">
      <a href="index.html" class="wordmark" style="border:0; color:var(--text);">EduNavi <small>Tundide ajalugu</small></a>
      <div style="display:flex; align-items:center; gap:14px;">
        <span id="user-email" class="mono" style="font-size:12px; color:var(--muted);"></span>
        <a href="index.html" class="btn-link" style="font-size:11px; padding:8px 14px; border:1px solid var(--line-strong); text-decoration:none;">Tagasi</a>
      </div>
    </header>

    <main class="history-main">
      <div id="history-loading" class="history-state">Laadin…</div>
      <div id="history-empty" class="history-state" style="display:none;">
        Sul pole veel ühtegi salvestatud tundi.<br />
        <a href="index.html" style="margin-top:14px; display:inline-block;">Alusta esimest tundi</a>
      </div>
      <div id="history-needauth" class="history-state" style="display:none;">
        Tundide ajalugu on saadaval ainult sisse logitud kasutajale.<br />
        <a href="index.html" style="margin-top:14px; display:inline-block;">Tagasi avalehele ja logi sisse</a>
      </div>
      <div id="history-list" style="display:none;"></div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="db.js"></script>
    <script src="auth.js"></script>
    <script src="history.js"></script>
  </body>
</html>

<!doctype html>
<html lang="et">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EduNavi — Õpetaja</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='50%25' y='62%25' font-family='Arial' font-size='18' font-weight='700' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="banner" id="config-banner"></div>

    <!-- Start screen -->
    <div id="start-screen" class="start-screen">
      <div class="start-card">
        <h1 class="display">EduNavi</h1>
        <p>Õpetaja otsustugi reaalajas.</p>
        <button class="primary start-button" id="start-btn">Alusta tundi</button>
      </div>
    </div>

    <!-- App -->
    <div id="app" class="app" style="display:none">
      <header class="app-header">
        <div class="wordmark">EduNavi <small>Õpetaja</small></div>
        <div></div>
        <div class="right">
          <button id="mic-btn" class="ctrl-btn" data-on="true">Mikrofon</button>
          <button id="cam-btn" class="ctrl-btn" data-on="true">Kaamera</button>
          <span class="pill" id="conn-pill"><span id="conn-text">ühendamine</span></span>
          <button id="end-btn">Lõpeta</button>
        </div>
      </header>

      <main class="lesson-grid">
        <div class="lesson-video">
          <div class="video-empty">Video laadimisel</div>
          <div id="jitsi-container" style="position:relative; width:100%; height:100%;"></div>
        </div>

        <aside class="lesson-sidebar">
          <div class="sidebar-card join-card-mini">
            <div class="qr-canvas-small" id="qr-canvas"></div>
            <div>
              <span class="eyebrow" style="font-size: 9px;">Liitumiskood</span>
              <div class="room-code-small" id="room-code">----</div>
              <div class="student-counter-mini">
                <strong id="student-count">0</strong>õpilast liitunud
              </div>
            </div>
          </div>

          <div class="sidebar-card">
            <span class="eyebrow">Praegune ülesanne</span>
            <div id="current-exercise" class="current-exercise empty">
              Pole aktiivset ülesannet
            </div>
            <div class="mini-totals">
              <div class="mini-tile yes">
                <span class="num" id="num-yes">0</span>
                <span class="label">Sain aru</span>
              </div>
              <div class="mini-tile maybe">
                <span class="num" id="num-unsure">0</span>
                <span class="label">Pole kindel</span>
              </div>
              <div class="mini-tile no">
                <span class="num" id="num-no">0</span>
                <span class="label">Ei saanud</span>
              </div>
            </div>
            <div style="height: 160px; border: 1px solid var(--line); padding: 10px; margin-top: 4px;">
              <canvas id="response-chart"></canvas>
            </div>
          </div>

          <div class="sidebar-card">
            <span class="eyebrow">Tunni statistika</span>
            <div class="stat-rows" style="border:0;">
              <div class="stat-row" style="padding: 10px 0;">
                <span class="label">Ülesandeid</span>
                <span class="num" id="stat-exercises" style="font-size:24px;">0</span>
              </div>
              <div class="stat-row" style="padding: 10px 0;">
                <span class="label">Vastuseid</span>
                <span class="num" id="stat-responses" style="font-size:24px;">0</span>
              </div>
              <div class="stat-row" style="padding: 10px 0; border-bottom:0;">
                <span class="label">Mõistetud %</span>
                <span class="num" id="stat-understanding" style="font-size:24px;">—</span>
              </div>
            </div>
          </div>
        </aside>

        <div class="lesson-input-bar">
          <textarea
            id="exercise-input"
            placeholder="Sisesta ülesanne — Cmd/Ctrl+Enter postitab"
            rows="1"
          ></textarea>
          <button class="primary" id="post-btn">Postita</button>
          <button id="reset-btn">Lähtesta</button>
        </div>
      </main>
    </div>

    <!-- Libs -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script src="https://meet.jit.si/external_api.js"></script>
    <script src="config.js"></script>
    <script src="shared.js"></script>
    <script src="teacher.js"></script>
  </body>
</html>
